services:
  - type: web
    name: shoebox-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "40"
      - key: MAX_DAILY_PARSES
        value: "500"
      - key: DB_PATH
        value: data/shoebox.db
